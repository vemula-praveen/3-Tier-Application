<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three Tier App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Three Tier App</h1>

      <form id="user-form">
        <label for="name">Add user</label>
        <div class="input-row">
          <input id="name" name="name" type="text" maxlength="100" placeholder="Enter a name" required />
          <button type="submit">Add</button>
        </div>
      </form>

      <div id="status" class="status"></div>
      <ul id="user-list"></ul>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
